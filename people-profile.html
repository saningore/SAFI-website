<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Profile — The Savannah Futures Institute">
  <title>Profile | The Savannah Futures Institute</title>
  <link rel="icon" href="assets/images/safi-logo.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=people-profile-layout-9">
</head>
<body class="inner-page people-profile-page">
  <div id="site-header"></div>
  <main id="main">
    <div id="people-profile-root" hidden>
      <section class="people-profile-hero people-profile-spec-hero">
        <div class="container">
          <nav class="breadcrumbs breadcrumbs--light" aria-label="Breadcrumb"><a href="index.html">Home</a> <span>&rsaquo;</span> <a href="people.html#listing">People</a></nav>
          <div class="people-profile-layout">
            <h1 class="people-profile-layout-name" id="profile-name"></h1>
            <aside class="people-profile-layout-aside" aria-label="Portrait">
              <div class="people-profile-photo-stack">
                <div class="people-profile-photo people-profile-photo--spec" id="profile-photo"></div>
                <p class="people-profile-role-banner" id="profile-role-banner"></p>
              </div>
            </aside>
            <div class="people-profile-spec-primary" id="profile-spec-primary" aria-label="Appointment details"></div>
            <div class="people-profile-spec-bio" id="profile-spec-bio" aria-label="Biography"></div>
          </div>
        </div>
      </section>

      <section class="section people-profile-spec-body">
        <div class="container">
          <div class="people-profile-spec-secondary" id="profile-spec-secondary" aria-label="Biography and links"></div>
          <p class="people-profile-back"><a href="people.html#listing">&larr; Back to people</a></p>
        </div>
      </section>
    </div>

    <section class="section" id="people-profile-missing" hidden>
      <div class="container">
        <div class="people-empty">
          <h3>Profile not found</h3>
          <p>This profile is not published or the link may be outdated.</p>
          <p><a href="people.html#listing" class="btn btn-primary">View all people</a></p>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/layout.js" data-page="about-people"></script>
  <script src="js/people-data.js?v=affiliation-1"></script>
  <script src="js/people-utils.js"></script>
  <script src="js/main.js"></script>
  <script src="js/people-profile.js"></script>
</body>
</html>
